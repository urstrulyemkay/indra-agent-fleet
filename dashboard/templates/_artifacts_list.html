{% if not artifacts %}
  <div class="text-zinc-500 text-sm">No artifacts yet. Run a script to see one here.</div>
{% else %}
  <div class="bg-zinc-900/60 border border-zinc-800 rounded-2xl divide-y divide-zinc-800">
    {% for a in artifacts %}
      <div class="flex items-center justify-between px-4 py-3 text-sm">
        <div class="min-w-0">
          <div class="font-medium truncate">{{ a.title }}</div>
          <div class="text-xs text-zinc-500 mt-0.5">
            <span class="uppercase tracking-widest text-[10px] mr-2">{{ a.kind }}</span>
            <span class="text-zinc-600">{{ a.agent_name }}</span>
            <span class="text-zinc-700">·</span>
            <span>{{ a.created_at[:19].replace('T', ' ') }} UTC</span>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <a
            href="/api/artifacts/{{ a.id }}/view"
            target="_blank"
            class="text-xs text-zinc-400 hover:text-emerald-400 transition"
          >view</a>
          <span class="text-zinc-700">·</span>
          <span class="text-[10px] text-zinc-600 font-mono truncate max-w-[14rem]">{{ a.path }}</span>
        </div>
      </div>
    {% endfor %}
  </div>
{% endif %}
