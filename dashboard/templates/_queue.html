<div>
  <div class="mb-6">
    <h1 class="display-serif page-title text-3xl text-ivory">Drafts queue</h1>
    <p class="text-xs text-zinc-500 mt-2">Every drafted reply / DM awaiting your approval. Click Approve to send via n8n + Meta Graph API. Reject to discard.</p>
  </div>

  <!-- KPI strip -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
    <div class="bg-midnight-900/60 border border-midnight-800 rounded-xl px-4 py-3">
      <div class="text-[10px] uppercase tracking-widest text-saffron-600/80">Pending</div>
      <div class="display-serif text-2xl mt-1 text-saffron-300">{{ counts.get('pending', 0) }}</div>
    </div>
    <div class="bg-midnight-900/60 border border-midnight-800 rounded-xl px-4 py-3">
      <div class="text-[10px] uppercase tracking-widest text-saffron-600/80">Sent</div>
      <div class="display-serif text-2xl mt-1 text-emerald-400">{{ counts.get('sent', 0) }}</div>
    </div>
    <div class="bg-midnight-900/60 border border-midnight-800 rounded-xl px-4 py-3">
      <div class="text-[10px] uppercase tracking-widest text-saffron-600/80">Rejected</div>
      <div class="display-serif text-2xl mt-1 text-zinc-400">{{ counts.get('rejected', 0) }}</div>
    </div>
    <div class="bg-midnight-900/60 border border-midnight-800 rounded-xl px-4 py-3">
      <div class="text-[10px] uppercase tracking-widest text-saffron-600/80">Failed</div>
      <div class="display-serif text-2xl mt-1 {% if counts.get('failed', 0) %}text-sindoor-400{% else %}text-zinc-500{% endif %}">{{ counts.get('failed', 0) }}</div>
    </div>
  </div>

  <div
    id="queue-list"
    hx-get="/api/queue/partial"
    hx-trigger="load"
    hx-swap="innerHTML">
    <div class="text-zinc-500 text-sm">Loading…</div>
  </div>
</div>
