<form hx-post="/api/run/comment_dm_responder" hx-target="#run-feedback" hx-swap="innerHTML"
      class="bg-midnight-900/60 border border-midnight-800 rounded-xl p-5 space-y-3">
  <div class="text-[11px] text-saffron-600/80 leading-relaxed">
    Drafts <span class="text-saffron-400">two outputs per comment</span> — a short public reply ("DM'd you 💌") and the actual DM that delivers what your post promised. Send both within Instagram's 24-hour reply window.
  </div>
  <div>
    <label class="block text-xs text-zinc-400 mb-1">Post context + CTA (what the post promised)</label>
    <input name="post_context" placeholder='e.g. "Drop a comment if you want to know your love language"'
      class="w-full bg-midnight-950 border border-midnight-800 rounded-lg px-3 py-2 text-sm text-ivory focus:outline-none focus:border-saffron-600/50">
  </div>
  <div>
    <label class="block text-xs text-zinc-400 mb-1">DM payload <span class="text-zinc-600">(what goes in the DM — link, quiz, mini-content)</span></label>
    <textarea name="dm_payload" rows="3" placeholder="e.g. https://5lovelanguages.com/quizzes/love-language — takes 3 minutes, knows you better than most therapists"
      class="w-full bg-midnight-950 border border-midnight-800 rounded-lg px-3 py-2 text-sm text-ivory focus:outline-none focus:border-saffron-600/50"></textarea>
  </div>
  <div>
    <label class="block text-xs text-zinc-400 mb-1">Comments (separate each with <span class="font-mono">---</span>; optional <span class="font-mono">from: @handle</span> on first line)</label>
    <textarea name="comments" rows="8" required placeholder="from: @someuser&#10;me!&#10;---&#10;from: @another&#10;Want to know mine&#10;---&#10;from: @third&#10;tell me!&#10;---&#10;..."
      class="w-full bg-midnight-950 border border-midnight-800 rounded-lg px-3 py-2 text-sm text-ivory focus:outline-none focus:border-saffron-600/50"></textarea>
  </div>
  <div class="flex items-center justify-between pt-1">
    <div id="run-feedback" class="text-xs text-zinc-500"></div>
    <button class="bg-saffron-500 hover:bg-saffron-400 text-midnight-950 text-sm font-medium px-4 py-2 rounded-lg transition">Invoke the call</button>
  </div>
</form>
